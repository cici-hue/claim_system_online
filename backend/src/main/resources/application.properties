spring.application.name=claim-management-system

# Database (H2 for dev, switch to PostgreSQL for prod)
spring.datasource.url=jdbc:h2:file:./data/cmsdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=OttoInternationalCMSSecretKey2024_ChangeInProduction
app.jwt.expiration-ms=86400000

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# Email (configure in prod)
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=cms@otto.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Server
server.port=8080
