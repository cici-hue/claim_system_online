# ============================================================
# Development Configuration - H2 Database (本地开发)
# ============================================================
# 生产环境请使用: application-prod.properties
# 切换方式: mvn spring-boot:run -Dspring-boot.run.profiles=prod
# ============================================================

spring.application.name=claim-management-system

# --- H2 本地数据库 ---
spring.datasource.url=jdbc:h2:file:./data/cmsdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- PostgreSQL (本地测试 Supabase 兼容性，取消注释即可切换) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/cmsdb
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.h2.console.enabled=false

# --- JWT (生产环境必须通过环境变量覆盖) ---
app.jwt.secret=${JWT_SECRET:OttoInternationalCMSSecretKey2024_DevOnly}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# --- 文件上传 ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# --- 邮件 ---
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=cms@otto.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- CORS ---
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# --- Server ---
server.port=8080

# --- Security ---
app.security.h2-console-enabled=true
